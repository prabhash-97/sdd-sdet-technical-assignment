name: SDD SDET Automation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-automation:
    name: Web Playwright Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        working-directory: web-automation
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run Web Playwright tests
        working-directory: web-automation
        run: mvn clean test

      - name: Set up Node.js for Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Web Allure HTML report
        if: always()
        working-directory: web-automation
        run: |
          if find target/allure-results -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            npm install --global allure-commandline
            allure generate target/allure-results --clean --output target/allure-report
          else
            echo "No Allure results found; skipping report generation."
          fi

      - name: Upload Web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          if-no-files-found: warn
          path: |
            web-automation/target/surefire-reports/
            web-automation/target/allure-results/
            web-automation/target/allure-report/
            web-automation/target/logs/
            web-automation/target/screenshots/

  api-automation:
    name: API REST Assured + Cucumber
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API automation tests
        working-directory: mobile-api-automation
        run: mvn clean test -Dsurefire.suiteXmlFiles=testng-api.xml

      - name: Set up Node.js for Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate API Allure HTML report
        if: always()
        working-directory: mobile-api-automation
        run: |
          if find target/allure-results -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            npm install --global allure-commandline
            allure generate target/allure-results --clean --output target/allure-report
          else
            echo "No Allure results found; skipping report generation."
          fi

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          if-no-files-found: warn
          path: |
            mobile-api-automation/target/surefire-reports/
            mobile-api-automation/target/allure-results/
            mobile-api-automation/target/allure-report/
            mobile-api-automation/target/cucumber-report.html
            mobile-api-automation/target/cucumber-report.json
            mobile-api-automation/target/logs/
