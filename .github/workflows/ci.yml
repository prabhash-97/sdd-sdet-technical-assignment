name: SDD SDET Automation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:

  web-automation:
    name: Web Playwright Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        working-directory: web-automation
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run Web Playwright tests
        working-directory: web-automation
        run: mvn clean test

      - name: Upload Web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: |
            web-automation/target/surefire-reports/
            web-automation/target/allure-results/
            web-automation/target/logs/
            web-automation/target/screenshots/

  api-automation:
    name: API REST Assured + Cucumber
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API automation tests
        working-directory: mobile-api-automation
        run: mvn clean test

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            mobile-api-automation/target/surefire-reports/
            mobile-api-automation/target/cucumber-report.html
            mobile-api-automation/target/cucumber-report.json
            mobile-api-automation/target/logs/