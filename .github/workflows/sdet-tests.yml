name: SDD Android Mobile Automation CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mobile-automation:
    if: false
    name: Appium Android Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.8.0
          appium --version
          appium driver install uiautomator2
          appium driver list --installed

      - name: Start emulator and run mobile tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            echo "=== Android devices ==="
            adb devices
            adb wait-for-device

            echo "=== Start Appium ==="
            appium --address 127.0.0.1 --port 4723 \
              > /tmp/appium.log 2>&1 &
            APPIUM_PID=$!

            APPIUM_READY=0
            for i in $(seq 1 60); do
              if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
                echo "Appium exited unexpectedly"
                cat /tmp/appium.log
                exit 1
              fi

              if curl --silent --fail \
                http://127.0.0.1:4723/status \
                > /tmp/appium-status.json; then
                APPIUM_READY=1
                break
              fi
              sleep 2
            done

            if [ "$APPIUM_READY" -ne 1 ]; then
              echo "Appium did not become ready"
              cat /tmp/appium.log
              exit 1
            fi

            cat /tmp/appium-status.json

            echo "=== Run mobile-only TestNG suite ==="
            cd mobile-api-automation
            mvn -B clean test \
              -Dsurefire.suiteXmlFiles=testng-mobile.xml
            TEST_EXIT=$?

            cd ..
            echo "=== Organize Allure evidence ==="
            python3 scripts/organize_test_evidence.py
            EVIDENCE_EXIT=$?

            echo "=== Test exit code: $TEST_EXIT ==="
            echo "=== Evidence organizer exit code: $EVIDENCE_EXIT ==="

            if [ "$TEST_EXIT" -ne 0 ]; then
              exit "$TEST_EXIT"
            fi
            exit "$EVIDENCE_EXIT"

      - name: Show Appium logs on failure
        if: failure()
        run: |
          if [ -f /tmp/appium.log ]; then
            cat /tmp/appium.log
          else
            echo "Appium log file was not created."
          fi

      - name: Upload mobile test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-test-evidence
          if-no-files-found: warn
          path: |
            mobile-api-automation/target/surefire-reports/
            mobile-api-automation/target/allure-results/
            mobile-api-automation/target/test-evidence/
            mobile-api-automation/target/logs/
