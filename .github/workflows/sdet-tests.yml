
name: SDD SDET Automation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-automation:
    name: Web Playwright Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        working-directory: web-automation
        run: >
          mvn exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run Web Playwright tests
        working-directory: web-automation
        run: mvn clean test

      - name: Upload Web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          if-no-files-found: warn
          path: |
            web-automation/target/surefire-reports/
            web-automation/target/allure-results/
            web-automation/target/logs/
            web-automation/target/screenshots/

  api-and-mobile-automation:
    name: API and Android Mobile Automation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium
        run: |
          npm install --global appium@3.8.0
          appium --version
          appium driver install uiautomator2
          appium driver list --installed

      - name: Start Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb devices
            adb wait-for-device

            appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &

            for i in $(seq 1 30); do
              if curl --silent --fail http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready"
                break
              fi
              sleep 2
            done

            if ! curl --silent --fail http://127.0.0.1:4723/status; then
              echo "Appium failed to start"
              cat /tmp/appium.log
              exit 1
            fi

            mvn -B clean test

      - name: Show Appium logs on failure
        if: failure()
        run: |
          if [ -f /tmp/appium.log ]; then
            cat /tmp/appium.log
          fi

      - name: Upload API and mobile test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-mobile-test-reports
          if-no-files-found: warn
          path: |
            mobile-api-automation/target/surefire-reports/
            mobile-api-automation/target/allure-results/
            mobile-api-automation/target/cucumber-report.html
            mobile-api-automation/target/cucumber-report.json
            mobile-api-automation/target/logs/
            mobile-api-automation/target/screenshots/